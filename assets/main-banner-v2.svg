<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Kurt Cobain — Software Developer</title>
  <desc id="desc">Animated profile banner with rotating development focus and profile views.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7F52FF"/>
      <stop offset=".44" stop-color="#02569B"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A98BFF"/>
      <stop offset=".48" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#2EE6A6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="phraseClip"><rect x="90" y="184" width="820" height="47" rx="12"/></clipPath>
    <style>
      .eyebrow{font:700 15px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#BFE3FF}
      .name{font:800 54px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .role{font:600 20px 'Segoe UI',Arial,sans-serif;fill:#EAF2FF}
      .phrase{font:700 24px 'JetBrains Mono','Segoe UI',monospace;fill:url(#accent);filter:url(#glow);letter-spacing:.3px}
      .p1{animation:slide1 12s cubic-bezier(.65,0,.35,1) infinite}
      .p2{animation:slide2 12s cubic-bezier(.65,0,.35,1) infinite}
      .p3{animation:slide3 12s cubic-bezier(.65,0,.35,1) infinite}
      @keyframes slide1{0%,26%{opacity:1;transform:translateY(0);filter:url(#glow)}31%,95%{opacity:0;transform:translateY(-38px)}96%{opacity:0;transform:translateY(38px)}100%{opacity:1;transform:translateY(0)}}
      @keyframes slide2{0%,29%{opacity:0;transform:translateY(38px)}34%,59%{opacity:1;transform:translateY(0);filter:url(#glow)}64%,100%{opacity:0;transform:translateY(-38px)}}
      @keyframes slide3{0%,62%{opacity:0;transform:translateY(38px)}67%,92%{opacity:1;transform:translateY(0);filter:url(#glow)}97%,100%{opacity:0;transform:translateY(-38px)}}
      @media(prefers-reduced-motion:reduce){.p1,.p2,.p3{animation:none}.p2,.p3{display:none}}
    </style>
  </defs>
  <rect width="1000" height="320" fill="#0D1117"/>
  <rect width="1000" height="286" fill="url(#bg)"/>
  <circle cx="870" cy="52" r="140" fill="#58A6FF" opacity=".12" filter="url(#soft)"/>
  <circle cx="105" cy="250" r="130" fill="#A98BFF" opacity=".15" filter="url(#soft)"/>
  <path d="M0 266 C205 237 333 314 535 278 C726 244 833 278 1000 244 V320 H0Z" fill="#0D1117"/>
  <path d="M0 265 C205 236 333 313 535 277 C726 243 833 277 1000 243" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".8"/>
  <g transform="translate(90 55)">
    <text class="eyebrow" x="0" y="0">HELLO, I AM</text>
    <text class="name" x="0" y="68">Kurt Cobain</text>
    <text class="role" x="2" y="102">kortCobein · Software Developer</text>
  </g>
  <g clip-path="url(#phraseClip)" text-anchor="middle">
    <text class="phrase p1" x="500" y="217">Mobile &amp; Cross-platform Development</text>
    <text class="phrase p2" x="500" y="217">Web &amp; Backend Solutions</text>
    <text class="phrase p3" x="500" y="217">Automation · Applied AI · Prototyping</text>
  </g>
  <g transform="translate(805 91)">
    <circle cx="0" cy="0" r="54" fill="#0D1117" opacity=".42" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="0" y="12" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI',Arial,sans-serif" font-size="36" font-weight="800">KC</text>
  </g>
</svg>
