<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">About Kort</title>
  <desc id="desc">Two alternating statements about Kort's software development work.</desc>

  <defs>
    <linearGradient id="border" x1="0" x2="1">
      <stop offset="0" stop-color="#7F52FF"/>
      <stop offset=".52" stop-color="#02569B"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#7F52FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58A6FF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7F52FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .slide {
      transform-box: fill-box;
      transform-origin: center;
      animation-duration: 12s;
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(.16,1,.3,1);
    }
    .slide-one { animation-name: slideOne; }
    .slide-two { animation-name: slideTwo; }
    .scan { animation: scan 12s linear infinite; }
    .progress-one { animation: progressOne 12s linear infinite; transform-origin: left; }
    .progress-two { animation: progressTwo 12s linear infinite; transform-origin: left; }

    @keyframes slideOne {
      0% { opacity: 0; transform: translateX(80px); filter: blur(7px); }
      6%, 42% { opacity: 1; transform: translateX(0); filter: blur(0); }
      49%, 100% { opacity: 0; transform: translateX(-80px); filter: blur(7px); }
    }
    @keyframes slideTwo {
      0%, 49% { opacity: 0; transform: translateX(80px); filter: blur(7px); }
      56%, 92% { opacity: 1; transform: translateX(0); filter: blur(0); }
      100% { opacity: 0; transform: translateX(-80px); filter: blur(7px); }
    }
    @keyframes scan {
      0%, 44% { transform: translateX(-1050px); opacity: 0; }
      47% { opacity: 1; }
      52% { transform: translateX(1050px); opacity: 0; }
      94% { transform: translateX(-1050px); opacity: 0; }
      97% { opacity: 1; }
      100% { transform: translateX(1050px); opacity: 0; }
    }
    @keyframes progressOne {
      0% { transform: scaleX(0); opacity: 1; }
      47% { transform: scaleX(1); opacity: 1; }
      50%, 100% { transform: scaleX(1); opacity: .18; }
    }
    @keyframes progressTwo {
      0%, 50% { transform: scaleX(0); opacity: .18; }
      97%, 100% { transform: scaleX(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .slide, .scan, .progress-one, .progress-two { animation: none; }
      .slide-one { opacity: 1; transform: none; filter: none; }
      .slide-two, .scan, .progress-two { display: none; }
      .progress-one { transform: scaleX(1); }
    }
  </style>

  <rect x="2" y="2" width="996" height="236" rx="22" fill="#0D1117" stroke="url(#border)" stroke-width="3"/>
  <rect class="scan" x="-120" y="3" width="120" height="234" fill="url(#scan)"/>

  <g class="slide slide-one">
    <text x="500" y="82" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="22" fill="#C9D1D9">
      Software development focused on <tspan fill="#58A6FF" font-weight="700">mobile, web, and backend solutions,</tspan>
    </text>
    <text x="500" y="119" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="22" fill="#C9D1D9">
      covering everything from <tspan fill="#A98BFF" font-weight="700">interfaces and business logic</tspan> to databases,
    </text>
    <text x="500" y="156" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="22" fill="#C9D1D9">
      integrations, automation, and services.
    </text>
  </g>

  <g class="slide slide-two">
    <text x="500" y="82" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="22" fill="#C9D1D9">
      This space brings together <tspan fill="#58A6FF" font-weight="700">academic, institutional, and personal projects,</tspan>
    </text>
    <text x="500" y="119" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="22" fill="#C9D1D9">
      along with <tspan fill="#A98BFF" font-weight="700">prototypes, experiments, and new areas of development</tspan>
    </text>
    <text x="500" y="156" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="22" fill="#C9D1D9">
      as my work evolves.
    </text>
  </g>

  <g>
    <rect x="388" y="204" width="100" height="4" rx="2" fill="#202938"/>
    <rect class="progress-one" x="388" y="204" width="100" height="4" rx="2" fill="#58A6FF"/>
    <rect x="512" y="204" width="100" height="4" rx="2" fill="#202938"/>
    <rect class="progress-two" x="512" y="204" width="100" height="4" rx="2" fill="#7F52FF"/>
  </g>
</svg>
